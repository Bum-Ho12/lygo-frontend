name: Deploy

# Builds the production image, pushes it to GHCR, then tells RumptyCloud to roll it out.
# Required repo settings (Settings → Secrets and variables → Actions):
#   vars.NEXT_PUBLIC_APP_URL        e.g. https://lygo.example.com
#   vars.NEXT_PUBLIC_ROOT_DOMAIN    e.g. lygo.example.com
#   secrets.RUMPTYCLOUD_DEPLOY_HOOK  deploy webhook URL from the RumptyCloud dashboard (optional;
#                                    without it the image is still pushed and you can deploy manually)
# Runtime env (LYGO_API_URL, SESSION_SECRET) is configured on RumptyCloud, never baked into the image.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'localhost' }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to RumptyCloud
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger RumptyCloud deploy hook
        env:
          HOOK: ${{ secrets.RUMPTYCLOUD_DEPLOY_HOOK }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RUMPTYCLOUD_DEPLOY_HOOK not set — image ${IMAGE}:${TAG} pushed, deploy it manually."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}:${TAG}\"}"
      - name: Smoke test
        if: vars.NEXT_PUBLIC_APP_URL != ''
        env:
          HOOK: ${{ secrets.RUMPTYCLOUD_DEPLOY_HOOK }}
        run: |
          [ -z "$HOOK" ] && { echo "No deploy hook — skipping smoke test"; exit 0; }
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.NEXT_PUBLIC_APP_URL }}/api/health" && exit 0
            sleep 15
          done
          echo "::error::Health check failed"; exit 1
