name: Deploy

# Verifies the production build, then tells RumptyCloud to deploy the commit.
# Required repo settings (Settings → Secrets and variables → Actions):
#   vars.NEXT_PUBLIC_APP_URL         e.g. https://lygo.example.com
#   vars.NEXT_PUBLIC_ROOT_DOMAIN     e.g. lygo.example.com
#   secrets.RUMPTYCLOUD_DEPLOY_HOOK  deploy webhook URL from the RumptyCloud dashboard (optional;
#                                    without it the job only verifies the build)
# Runtime env (LYGO_API_URL, SESSION_SECRET) is configured on RumptyCloud, never in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to RumptyCloud
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'localhost' }}
      HOOK: ${{ secrets.RUMPTYCLOUD_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Trigger RumptyCloud deploy hook
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RUMPTYCLOUD_DEPLOY_HOOK not set — build verified, deploy skipped."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_SHA}\"}"

      - name: Smoke test
        if: vars.NEXT_PUBLIC_APP_URL != ''
        run: |
          [ -z "$HOOK" ] && { echo "No deploy hook — skipping smoke test"; exit 0; }
          for i in $(seq 1 20); do
            curl -fsS "${NEXT_PUBLIC_APP_URL}/api/health" && exit 0
            sleep 15
          done
          echo "::error::Health check failed"; exit 1
